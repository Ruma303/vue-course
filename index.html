<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <title>Vue Form</title>

<body>
  <div id="app" class="flex flex-col content-center flex-wrap p-4 gap-4">
    <h1 class="text-4xl font-semibold">Form Handling con Vue</h1>

    <form @submit.prevent="submitForm" class="flex flex-col content-start gap-2">

      <!-- Con uso standard di :value -->
      <label>Your Name: </label>
      <input type="text" class="bg-neutral-100 rounded px-2 py-1 border-2 border-black"
        placeholder="Insert your name..."
        :value="name"
        @input="name=$event.target.value"
        >
        <!-- @input="updateName($event)" -->
        <p v-if="name">{{ name }}</p>

      <label for="">Your Message: </label>
      <input type="text" class="bg-neutral-100 rounded px-2 py-1 border-2 border-black" v-model.trim="msg">
      <p v-if="msg">{{ msg }}</p>

      <label for="">Your Age: </label>
      <input type="number" class="bg-neutral-100 rounded px-2 py-1 border-2 border-black" v-model.number="age">
      <button type="button" @click="increment">Increment</button>
      <button type="button" @click="age--">Decrement</button>

      <button type="submit" class="bg-sky-500 rounded w-fit px-2 py-1">Submit</button>
